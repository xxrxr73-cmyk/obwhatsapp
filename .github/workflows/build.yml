name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton safely
        run: |
          mkdir -p /tmp/main_backup
          cp lib/main.dart /tmp/main_backup/main.dart || true
          flutter create . --platforms=android --org=com.obwhatsapp.viewer --overwrite
          cp /tmp/main_backup/main.dart lib/main.dart || true

      - name: Upgrade compileSdk to 36
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
