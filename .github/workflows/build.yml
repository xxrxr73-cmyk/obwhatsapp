name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build and Configure Project Structure
        run: |
          # 1. إنشاء ملف pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: obwhatsapp_viewer
          description: "OBWhatsApp Database Viewer"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            file_picker: ^8.0.0
            sqflite: ^2.3.0
            path: ^1.8.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          # 2. إنشاء كود التطبيق الأساسي
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart' as p;

          void main() {
            runApp(const OBWhatsAppViewerApp());
          }

          class OBWhatsAppViewerApp extends StatelessWidget {
            const OBWhatsAppViewerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'OBWhatsApp Viewer',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String? _dbPath;
            bool _isLoading = false;
            List<Map<String, dynamic>> _chats = [];
            String _statusMessage = 'الرجاء اختيار ملف قاعدة البيانات (msgstore.db)';

            Future<void> _pickDbFile() async {
              FilePickerResult? result = await FilePicker.platform.pickFiles();
              if (result != null && result.files.single.path != null) {
                setState(() {
                  _dbPath = result.files.single.path;
                  _statusMessage = 'تم اختيار الملف: ${p.basename(_dbPath!)}';
                });
              }
            }

            Future<void> _openAndLoadDatabase() async {
              if (_dbPath == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('الرجاء اختيار ملف قاعدة البيانات أولاً')),
                );
                return;
              }

              setState(() {
                _isLoading = true;
                _statusMessage = 'جاري قراءة قاعدة البيانات...';
              });

              try {
                if (_dbPath!.contains('.crypt')) {
                  setState(() {
                    _isLoading = false;
                    _statusMessage = 'الملف مشفر بصيغة crypt. يرجى اختيار ملف msgstore.db غير مشفر لقراءته مباشرة.';
                  });
                  return;
                }

                Database db = await openReadOnlyDatabase(_dbPath!);
                
                List<Map<String, dynamic>> result = await db.rawQuery('''
                  SELECT jid.raw_string AS chat_jid, message.text_data AS text, message.timestamp AS time
                  FROM message
                  LEFT JOIN jid ON message.chat_row_id = jid._id
                  WHERE message.text_data IS NOT NULL
                  ORDER BY message.timestamp DESC
                  LIMIT 100
                ''');

                setState(() {
                  _chats = result;
                  _isLoading = false;
                  _statusMessage = 'تم قراءة ${_chats.length} رسالة بنجاح!';
                });

                await db.close();
              } catch (e) {
                setState(() {
                  _isLoading = false;
                  _statusMessage = 'خطأ أثناء قراءة البيانات: $e';
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('OBWhatsApp Database Viewer'),
                  centerTitle: true,
                ),
                body: Directionality(
                  textDirection: TextDirection.rtl,
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      children: [
                        Card(
                          elevation: 2,
                          child: Padding(
                            padding: const EdgeInsets.all(12.0),
                            child: ListTile(
                              leading: const Icon(Icons.storage, color: Colors.teal),
                              title: Text(_dbPath != null ? p.basename(_dbPath!) : 'لم يتم اختيار قاعدة البيانات'),
                              trailing: ElevatedButton(
                                onPressed: _pickDbFile,
                                child: const Text('اختيار DB'),
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          height: 48,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.teal,
                              foregroundColor: Colors.white,
                            ),
                            onPressed: _isLoading ? null : _openAndLoadDatabase,
                            icon: const Icon(Icons.folder_open),
                            label: const Text('فتح النسخة وعرض المحادثات', style: TextStyle(fontSize: 16)),
                          ),
                        ),
                        const SizedBox(height: 12),
                        Text(
                          _statusMessage,
                          style: const TextStyle(color: Colors.grey, fontSize: 13),
                          textAlign: TextAlign.center,
                        ),
                        const SizedBox(height: 12),
                        Expanded(
                          child: _isLoading
                              ? const Center(child: CircularProgressIndicator())
                              : _chats.isEmpty
                                  ? const Center(child: Text('لا توجد رسائل معروضة بعد.'))
                                  : ListView.builder(
                                      itemCount: _chats.length,
                                      itemBuilder: (context, index) {
                                        final item = _chats[index];
                                        return Card(
                                          margin: const EdgeInsets.symmetric(vertical: 4),
                                          child: ListTile(
                                            title: Text(item['chat_jid'] ?? 'محادثة', style: const TextStyle(fontWeight: FontWeight.bold)),
                                            subtitle: Text(item['text'] ?? ''),
                                          ),
                                        );
                                      },
                                    ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 3. إنشاء هيكل مشروع أندرويد عبر Flutter
          mkdir -p /tmp/app_backup
          cp -r lib /tmp/app_backup/
          cp pubspec.yaml /tmp/app_backup/

          flutter create . --platforms=android --org=com.obwhatsapp.viewer --overwrite

          cp -r /tmp/app_backup/lib .
          cp /tmp/app_backup/pubspec.yaml .

          # 4. ضبط compileSdk و targetSdk بملف التطبيق الرئيسي
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.obwhatsapp.viewer"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId "com.obwhatsapp.viewer"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

          # 5. [خطوة الفصل الحاسمة] إجبار جميع التبعيات والمكتبات الخارجية على استخدام compileSdk 34 و minSdk 21
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 21
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF

      - name: Fetch Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
